[workspace]
# resolver 3 by name: a virtual manifest has no edition to imply it, and
# without it Cargo falls back to resolver 1.
resolver = "3"
# The one member is the checker (ADR 4.10.26b D4). No example is a member of
# anything this repo ships: each builds through its own ecosystem.
members = ["tools/examples-check"]
# The two vendored submodules build through their own manifests and locks
# (`--manifest-path`), so promotion has no member to strip.
exclude = ["tools/scs-snapshot", "tools/code-health"]
