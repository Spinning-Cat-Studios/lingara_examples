[package]
name = "lingara-examples-check"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "Checks that every Lingara example installs only released packages, at the version examples.toml names"
# The release is the repository's, never this crate's (ADR 4.10.26b D2).
publish = false

[[bin]]
name = "lingara-examples-check"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.23"
ureq = "3"

[dev-dependencies]
tempfile = "3"
