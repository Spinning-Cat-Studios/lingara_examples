# examples.toml — every example, and exactly what it installs (ADR 4.10.26b D3).
#
# One [[example]] per example directory. `version` is exact and spelt as the
# ecosystem's manifest writes it (npm, crates and Maven `0.1.0-alpha.10`, Go and
# Packagist `v0.1.0-alpha.10`; a Cargo.toml writes it after `=`).
# `lingara-examples-check` reads this file and nothing
# else for the set of examples:
#
# [[example]]
# path     = "integrations/<name>"   # the directory; unique
# section  = "integrations"          # integrations · apps · games — the path's first segment
# language = "typescript"            # a make/lang/<language>.mk must exist
# title    = "What it shows"
# live     = false                   # the private live job runs it
# packages = [{ registry = "npm", name = "@lingara/api", version = "0.1.0-alpha.10" }]
# scopes   = ["events:read"]         # documentation; the live client holds their union
schema = 1

[[example]]
path = "integrations/fake-game"
section = "integrations"
language = "typescript"
title = "A headless game on the event feed"
live = true
packages = [{ registry = "npm", name = "@lingara/api", version = "0.2.0-alpha.1" }]
scopes = ["events:read", "events:write", "lesson_plans:read", "lesson_plans:write"]

[[example]]
path = "integrations/luba-dive-deck"
section = "integrations"
language = "go"
title = "Luba's Dive Deck: two processes, one scope each"
live = true
packages = [{ registry = "go", name = "github.com/Spinning-Cat-Studios/lingara_api_clients/go", version = "v0.2.0-alpha.1" }]
scopes = ["vocab:generate", "usage:read"]

[[example]]
path = "integrations/farducks-batter-rewards"
section = "integrations"
language = "php"
title = "Farducks' Batter Rewards: a plan while the order fries"
live = true
packages = [{ registry = "packagist", name = "spinningcatstudios/lingara", version = "v0.2.0-alpha.1" }]
scopes = ["lesson_plans:write", "lesson_plans:read"]

[[example]]
path = "apps/luba-dive-log"
section = "apps"
language = "typescript"
title = "Luba's Dive Log: an app on the shelf, end to end"
live = false
packages = [
  { registry = "npm", name = "@lingara/apps", version = "0.1.0-alpha.7" },
  { registry = "npm", name = "@lingara/api", version = "0.2.0-alpha.1" },
]
scopes = ["lesson_plans:read"]   # the owner's client, for the phrasebook read; the manifest itself declares none

[[example]]
path = "games/bevy/night-market"
section = "games"
language = "rust"
title = "The Night Market, in Bevy, with its Rust server"
live = false
packages = [
  { registry = "crates", name = "bevy_lingara", version = "0.1.0-alpha.8" },
  { registry = "crates", name = "lingara-embed", version = "0.1.0-alpha.8" },
  { registry = "crates", name = "lingara", version = "0.2.0-alpha.1" },
]
scopes = ["embed:mint"]

[[example]]
path = "games/jvm/night-market"
section = "games"
language = "kotlin"
title = "The Night Market, in libGDX, with its Kotlin server"
live = false
packages = [
  { registry = "maven", name = "com.getlingara:lingara-embed-kotlin", version = "0.1.0-alpha.8" },
  { registry = "maven", name = "com.getlingara:lingara-embed-natives-desktop", version = "0.1.0-alpha.8" },
  { registry = "maven", name = "com.getlingara:lingara-embed-server-kotlin", version = "0.1.0-alpha.8" },
  { registry = "maven", name = "com.getlingara:lingara-kotlin", version = "0.2.0-alpha.1" },
]
scopes = ["embed:mint"]

[[example]]
path = "websites/rust/night-market"
section = "websites"
language = "rust"
title = "The Night Market, as a website with the Lingara widget, on the Rust server kit"
live = false
packages = [
  { registry = "crates", name = "lingara-embed", version = "0.1.0-alpha.7" },
  { registry = "crates", name = "lingara", version = "0.2.0-alpha.1" },
]
scopes = ["embed:mint", "embed:play", "events:read", "events:write", "lesson_plans:read", "lesson_plans:write"]
