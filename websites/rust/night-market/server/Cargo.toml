[package]
name = "night-market-site"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false
description = "The Night Market as a website: a page that mounts the Lingara widget, and the server that mints its token and asks for its plan"

[[bin]]
name = "night-market-site"
path = "src/main.rs"

# Its own workspace and its own lock (ADR 14.10.26p D2, as 13.10.26h D1), so
# the directory can be copied out of the repository as it is.
[workspace]

# Exact, from crates.io, at the Bevy server's pins. lingara-embed's `server`
# feature is the Rust server kit (the mint and the widget snippet); `lingara`
# is named directly for its client builder, its events and its webhook
# verifier. getrandom makes the stand-in session cookie.
[dependencies]
axum = "=0.8.9"
getrandom = "=0.4.3"
lingara = "=0.2.0-alpha.1"
lingara-embed = { version = "=0.1.0-alpha.7", features = ["server"] }
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "net"] }

# The offline test: an in-process stub of Lingara, and a webhook signed the
# way Lingara signs one (Standard Webhooks, HMAC-SHA256).
[dev-dependencies]
base64 = "=0.22.1"
hmac = "=0.12.1"
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tower = { version = "=0.5.3", features = ["util"] }
