name: CI

# Every push and pull request (ADR 4.10.26b D6). Public: no secrets and no
# submodules, so a fork's pull request runs it as it stands.
#
# `check` builds the checker once and hands it to every example leg, so no
# leg compiles it. Only a Rust example's own leg needs Rust, and it installs
# the channel that example's rust-toolchain.toml names (ADR 13.10.26h D6).
# A Kotlin leg needs a JDK and nothing else: the example's wrapper is
# validated, then fetches its own Gradle (ADR 13.10.26i D6).
# With no rows the matrix is empty, which is an error in GitHub Actions, so
# `examples` is skipped on count 0.
#
# A Bevy leg is the heaviest: it frees the runner's disk first and builds with
# line tables only, as the kit's own release does, and it has no cache, so it
# measures the cold build a cloner meets. Its two Bevy steps (free disk,
# Linux libraries) are gated on the path, `games/bevy/`, not on `rust`, so a
# Rust row with no Bevy in it (a website's server) never has to opt out
# (ADR 14.10.26p D6).
#
# A matrix value reaches make through env, never inline: the leak scan reads
# every token after `make ` in a shipped workflow as a target, and DIR="$DIR"
# is one token with an `=`, which it skips.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Index, dependencies, checker
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.matrix.outputs.examples }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make check-publishable
      # `include` alone: every other matrix key must be an array.
      - id: matrix
        name: The example matrix
        run: |
          json=$(target/release/lingara-examples-check list --json)
          echo "examples=$(jq -c '{include}' <<<"$json")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq .count <<<"$json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: examples-check
          path: target/release/lingara-examples-check

  examples:
    name: ${{ matrix.path }}
    needs: check
    if: needs.check.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.examples) }}
    env:
      DIR: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: examples-check
          path: ${{ runner.temp }}/bin
      - name: The checker, as downloaded
        run: |
          chmod +x "$RUNNER_TEMP/bin/lingara-examples-check"
          echo "EXAMPLES_CHECK=$RUNNER_TEMP/bin/lingara-examples-check" >> "$GITHUB_ENV"
      - if: matrix.language == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ matrix.path }}/.node-version
      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.path }}/go.mod
      - if: matrix.language == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - if: matrix.language == 'rust' && startsWith(matrix.path, 'games/bevy/')
        name: Free disk for a Bevy build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - if: matrix.language == 'rust' && startsWith(matrix.path, 'games/bevy/')
        name: Bevy's Linux libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - if: matrix.language == 'rust'
        name: The channel rust-toolchain.toml names, and line tables only
        run: |
          rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$DIR/rust-toolchain.toml")" --profile minimal
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
      # A Kotlin example commits its Gradle wrapper, a binary in a public
      # repository, so the jar is validated before it runs; the wrapper then
      # fetches Gradle itself (ADR 13.10.26i D6).
      - if: matrix.language == 'kotlin'
        uses: gradle/actions/wrapper-validation@v4
      - if: matrix.language == 'kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: make build-example test-example DIR="$DIR"
