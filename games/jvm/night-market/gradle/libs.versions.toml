# Every version the Night Market builds with, exact, and nowhere else.
#
# Each com.getlingara artefact has its own [versions] key, named by its
# artifact id: a bump moves one package, and the bump job rewrites that one
# line. lingara-embed-kotlin and lingara-embed-natives-desktop must be merged
# at the same version (the kit refuses natives of another version at start).

[versions]
lingara-embed-kotlin = "0.1.0-alpha.7"
lingara-embed-natives-desktop = "0.1.0-alpha.7"
lingara-embed-server-kotlin = "0.1.0-alpha.7"
lingara-kotlin = "0.2.0-alpha.1"
kotlin = "2.4.10"
kotlinx-coroutines = "1.10.2"
gdx = "1.14.2"
junit = "5.14.4"
junit-platform = "1.14.4"

[libraries]
lingara-embed-kotlin = { module = "com.getlingara:lingara-embed-kotlin", version.ref = "lingara-embed-kotlin" }
lingara-embed-natives-desktop = { module = "com.getlingara:lingara-embed-natives-desktop", version.ref = "lingara-embed-natives-desktop" }
lingara-embed-server-kotlin = { module = "com.getlingara:lingara-embed-server-kotlin", version.ref = "lingara-embed-server-kotlin" }
lingara-kotlin = { module = "com.getlingara:lingara-kotlin", version.ref = "lingara-kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
gdx = { module = "com.badlogicgames.gdx:gdx", version.ref = "gdx" }
gdx-freetype = { module = "com.badlogicgames.gdx:gdx-freetype", version.ref = "gdx" }
gdx-backend-lwjgl3 = { module = "com.badlogicgames.gdx:gdx-backend-lwjgl3", version.ref = "gdx" }
gdx-platform = { module = "com.badlogicgames.gdx:gdx-platform", version.ref = "gdx" }
gdx-freetype-platform = { module = "com.badlogicgames.gdx:gdx-freetype-platform", version.ref = "gdx" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
